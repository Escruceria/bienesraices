[build]
  command = "echo \"Sitio estatico listo para publicar\""
  publish = "."

[build.environment]
  NODE_VERSION = "14.21.3"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/build/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/build/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/build/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
